<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silsilah Keluarga</title>
    <style>
      :root {
        --bg: #f3efe6;
        --ink: #2b2a26;
        --muted: #7a7568;
        --line: #b9b19d;
        --card: #fffdf8;
        --L: #3f6b7d;
        --P: #a4526a;
        --acc: #4a5d3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e211c;
          --ink: #ece8dc;
          --muted: #a09a88;
          --line: #4d5246;
          --card: #292d25;
          --L: #7fb0c4;
          --P: #dc8fa8;
          --acc: #a3bd88;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 Georgia,
          "Times New Roman",
          serif;
        padding: 16px;
        max-width: 900px;
        margin-inline: auto;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: none;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 12px;
      }
      button:hover {
        border-color: var(--acc);
        color: var(--acc);
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--acc);
        outline-offset: 2px;
      }
      header {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      header h1 {
        font-size: 20px;
        margin: 0 auto 0 0;
      }
      select {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px;
        max-width: 180px;
      }
      #crumbs {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        margin-bottom: 24px;
        font-family: ui-monospace, Menlo, monospace;
        font-size: 14px;
      }
      #crumbs button {
        border: none;
        padding: 2px 6px;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      #crumbs .sep {
        color: var(--muted);
      }
      #crumbs .cur {
        font-weight: bold;
        padding: 2px 6px;
      }
      .lbl {
        color: var(--muted);
        font-size: 14px;
        margin: 20px 0 8px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin: 14px 0 6px 4px;
      }
      .fam {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 14px;
        background: rgba(0, 0, 0, 0.015);
      }
      .row,
      .couple {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: stretch;
      }
      .col {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-left: 5px solid var(--line);
        border-radius: 8px;
        padding: 10px 14px;
        min-width: 170px;
        text-align: left;
      }
      .card.L {
        border-left-color: var(--L);
      }
      .card.P {
        border-left-color: var(--P);
      }
      .card b {
        display: block;
        font-size: 17px;
      }
      .card small {
        color: var(--muted);
        display: block;
      }
      .card.pivot {
        border-width: 2px;
        border-left-width: 6px;
      }
      .card.step {
        opacity: 0.55;
        border-style: dashed;
      }
      .couple {
        align-items: center;
      }
      .couple .heart {
        color: var(--muted);
        font-size: 22px;
      }
      .ghost {
        border-style: dashed;
        color: var(--muted);
        align-self: stretch;
        min-width: 170px;
      }
      .parents {
        font-size: 14px;
        color: var(--muted);
      }
      .parents button {
        border: none;
        padding: 0 4px;
        text-decoration: underline;
        color: var(--ink);
      }
      dialog {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--ink);
        width: min(420px, 92vw);
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.45);
      }
      label {
        display: block;
        margin: 8px 0 2px;
        font-size: 14px;
        color: var(--muted);
      }
      dialog input,
      dialog select,
      dialog textarea {
        width: 100%;
        max-width: none;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .foot {
        display: flex;
        gap: 8px;
        margin-top: 16px;
        justify-content: flex-end;
      }
      .empty {
        padding: 40px 16px;
        text-align: center;
        border: 1px dashed var(--line);
        border-radius: 8px;
      }
      .primary {
        background: var(--acc);
        color: var(--bg);
        border-color: var(--acc);
      }
      .danger:hover {
        border-color: #b33;
        color: #b33;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Silsilah Keluarga</h1>
      <select id="pick" aria-label="Lompat ke orang"></select>
      <button id="btnExport">Ekspor</button>
      <button id="btnImport">Impor</button>
      <input type="file" id="file" accept=".json" hidden />
    </header>
    <nav id="crumbs" aria-label="Jalur keturunan"></nav>
    <main id="main"></main>

    <dialog id="dlg">
      <form id="form" method="dialog">
        <h2 id="dTitle" style="margin: 0 0 4px; font-size: 18px"></h2>
        <label for="fName">Nama</label><input id="fName" required />
        <div class="two">
          <div>
            <label for="fG">Jenis kelamin</label
            ><select id="fG">
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>
          <div>
            <label for="fBorn">Lahir (tahun)</label
            ><input id="fBorn" placeholder="1950" />
          </div>
        </div>
        <label for="fDied">Wafat (tahun, kosongkan bila masih hidup)</label
        ><input id="fDied" /> <label for="fNote">Catatan</label
        ><textarea id="fNote" rows="2"></textarea>
        <div class="foot">
          <button type="button" id="btnDel" class="danger">Hapus</button>
          <button type="button" id="btnCancel">Batal</button>
          <button class="primary">Simpan</button>
        </div>
      </form>
    </dialog>

    <script>
      const KEY = "silsilah_v1";
      let db = { people: {}, pivot: null, seq: 0 };
      try {
        const s = JSON.parse(localStorage.getItem(KEY));
        if (s && s.people) db = s;
      } catch (e) {}

      // migrasi data lama (spouse tunggal / exSpouses) ke daftar spouses[] {id, status}
      function normalize() {
        let max = -1;
        Object.values(db.people).forEach((p) => {
          if (typeof p.order !== "number") p.order = ++max;
          else max = Math.max(max, p.order);
          if (!Array.isArray(p.spouses)) {
            p.spouses = [];
            if (p.spouse) p.spouses.push({ id: p.spouse, status: "married" });
            if (Array.isArray(p.exSpouses))
              p.exSpouses.forEach((id) =>
                p.spouses.push({ id, status: "divorced" }),
              );
          }
        });
        if (typeof db.seq !== "number") db.seq = max + 1;
      }
      normalize();

      const save = () => {
        try {
          localStorage.setItem(KEY, JSON.stringify(db));
        } catch (e) {
          alert("Gagal menyimpan ke localStorage. Coba ekspor datanya.");
        }
      };
      const P = (id) => db.people[id];
      const $ = (id) => document.getElementById(id);
      const uid = () =>
        "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
      }
      function years(p) {
        return p.born || p.died
          ? (p.born || "?") + (p.died ? " – " + p.died : "")
          : "";
      }

      // cls: kelas tambahan ("step" = anak tiri / mantan). tag: label kecil tambahan.
      function personCard(p, pivot, cls, tag) {
        const b = el(
          "button",
          "card " + p.g + (pivot ? " pivot" : "") + (cls ? " " + cls : ""),
        );
        b.append(el("b", "", p.name));
        if (years(p)) b.append(el("small", "", years(p)));
        if (tag) b.append(el("small", "", tag));
        if (p.note) b.append(el("small", "", p.note));
        if (!pivot) b.onclick = () => go(p.id);
        else b.onclick = () => openForm({ mode: "edit", id: p.id });
        b.title = pivot ? "Klik untuk edit" : "Buka keluarga " + p.name;
        return b;
      }

      function go(id) {
        db.pivot = id;
        save();
        render();
        window.scrollTo(0, 0);
      }

      function setStatus(piv, partnerId, status) {
        const partner = P(partnerId);
        const a = piv.spouses.find((s) => s.id === partnerId);
        const b = partner.spouses.find((s) => s.id === piv.id);
        if (a) a.status = status;
        if (b) b.status = status;
        save();
        render();
      }

      function chainOf(p) {
        const chain = [],
          seen = new Set();
        while (p && !seen.has(p.id)) {
          seen.add(p.id);
          chain.unshift(p);
          p = P(p.father) || P(p.mother);
        }
        return chain;
      }

      // Kelompokkan anak per pasangan, plus anak tiri (anak pasangan yang bukan anak piv)
      // dan anak "lainnya" (orang tua satunya tidak tercatat / bukan pasangan resmi).
      function familyGroups(piv) {
        const spouses = (piv.spouses || [])
          .map((s) => ({ ...s, p: P(s.id) }))
          .filter((s) => s.p);
        const groups = spouses.map((s) => {
          const partner = s.p;
          const together = Object.values(db.people)
            .filter(
              (k) =>
                (k.father === piv.id || k.mother === piv.id) &&
                (k.father === partner.id || k.mother === partner.id),
            )
            .sort((a, b) => a.order - b.order);
          const stepkids = Object.values(db.people)
            .filter(
              (k) =>
                (k.father === partner.id || k.mother === partner.id) &&
                k.father !== piv.id &&
                k.mother !== piv.id,
            )
            .sort((a, b) => a.order - b.order);
          return { status: s.status, partner, together, stepkids };
        });
        const partnerIds = new Set(spouses.map((s) => s.id));
        const solo = Object.values(db.people)
          .filter((k) => {
            if (!(k.father === piv.id || k.mother === piv.id)) return false;
            const other = k.father === piv.id ? k.mother : k.father;
            return !other || !partnerIds.has(other);
          })
          .sort((a, b) => a.order - b.order);
        return { groups, solo };
      }

      function kidCol(kids, extraCls, extraTag, addFn) {
        const col = el("div", "col");
        kids.forEach((k) =>
          col.append(personCard(k, false, extraCls, extraTag)),
        );
        if (addFn) {
          const add = el("button", "card ghost", "+ Tambah anak");
          add.onclick = addFn;
          col.append(add);
        }
        return col;
      }

      function render() {
        const all = Object.values(db.people).sort((a, b) =>
          a.name.localeCompare(b.name),
        );
        const pick = $("pick");
        pick.replaceChildren(new Option("Lompat ke…", ""));
        all.forEach((p) => pick.add(new Option(p.name, p.id)));

        const crumbs = $("crumbs"),
          main = $("main");
        crumbs.replaceChildren();
        main.replaceChildren();
        const piv = P(db.pivot);

        if (!piv) {
          crumbs.textContent = "/";
          const e = el("div", "empty");
          e.append(
            el(
              "p",
              "",
              "Belum ada data. Mulai dari orang paling atas yang kamu ketahui, misalnya kakek.",
            ),
          );
          const b = el("button", "primary", "Tambah orang pertama");
          b.onclick = () => openForm({ mode: "new", rel: "root" });
          e.append(b);
          main.append(e);
          return;
        }

        // Breadcrumb
        const chain = chainOf(piv);
        crumbs.append(el("span", "sep", "/"));
        chain.forEach((p, i) => {
          if (i === chain.length - 1) crumbs.append(el("span", "cur", p.name));
          else {
            const b = el("button", "", p.name);
            b.onclick = () => go(p.id);
            crumbs.append(b, el("span", "sep", "/"));
          }
        });
        if (chain.length > 1) {
          const up = el("button", "", ".. naik");
          up.style.marginLeft = "auto";
          up.onclick = () => go(chain[chain.length - 2].id);
          crumbs.append(up);
          if (chain.length > 2) {
            const up2 = el("button", "", "../.. naik 2");
            up2.onclick = () => go(chain[chain.length - 3].id);
            crumbs.append(up2);
          }
        }

        // Orang tua — diurut sesuai urutan pembuatan, bukan jenis kelamin
        const f = P(piv.father),
          m = P(piv.mother);
        const pr = el("div", "parents", "Orang tua: ");
        [f, m]
          .filter(Boolean)
          .sort((a, b) => a.order - b.order)
          .forEach((p, i) => {
            if (i) pr.append(" & ");
            const b = el("button", "", p.name);
            b.onclick = () => go(p.id);
            pr.append(b);
          });
        if (!f || !m) {
          const b = el(
            "button",
            "",
            "+ tambah " + (!f && !m ? "orang tua" : !f ? "ayah" : "ibu"),
          );
          b.onclick = () =>
            openForm({
              mode: "new",
              rel: "parent",
              ref: piv.id,
              g: !f ? "L" : "P",
            });
          pr.append(b);
        }
        main.append(pr);

        // Pasangan — bisa lebih dari satu sekaligus (poligami), plus status cerai per pasangan
        main.append(el("div", "lbl", "Pasangan & Anak"));
        const { groups, solo } = familyGroups(piv);

        groups.forEach((g) => {
          const fam = el("div", "fam");
          const couple = el("div", "couple");
          couple.append(personCard(piv, true));
          const married = g.status === "married";
          couple.append(
            el("span", "heart", married ? "♥" : "💔"),
            personCard(
              g.partner,
              false,
              married ? null : "step",
              married ? null : "(cerai)",
            ),
          );
          const bd = el("button", "", married ? "Cerai" : "Rujuk");
          bd.onclick = () =>
            setStatus(piv, g.partner.id, married ? "divorced" : "married");
          couple.append(bd);
          fam.append(couple);

          fam.append(
            el(
              "div",
              "sub",
              "Anak bersama " + g.partner.name + " (" + g.together.length + ")",
            ),
          );
          fam.append(
            kidCol(g.together, null, null, () =>
              openForm({
                mode: "new",
                rel: "child",
                ref: piv.id,
                partner: g.partner.id,
              }),
            ),
          );

          if (g.stepkids.length) {
            fam.append(
              el(
                "div",
                "sub",
                "Anak " +
                  g.partner.name +
                  " dari sebelumnya (" +
                  g.stepkids.length +
                  ")",
              ),
            );
            fam.append(kidCol(g.stepkids, "step", "(anak tiri)", null));
          }
          main.append(fam);
        });

        const addSp = el("button", "card ghost", "+ Tambah pasangan");
        addSp.onclick = () =>
          openForm({
            mode: "new",
            rel: "spouse",
            ref: piv.id,
            g: piv.g === "L" ? "P" : "L",
          });
        main.append(addSp);

        if (solo.length || !groups.length) {
          main.append(
            el(
              "div",
              "sub",
              "Anak lainnya / tanpa pasangan tercatat (" + solo.length + ")",
            ),
          );
          main.append(
            kidCol(solo, null, null, () =>
              openForm({ mode: "new", rel: "child", ref: piv.id }),
            ),
          );
        }
      }

      // ---------- Form ----------
      let ctx = null;
      function openForm(c) {
        ctx = c;
        const p = c.mode === "edit" ? P(c.id) : {};
        $("dTitle").textContent =
          c.mode === "edit"
            ? "Edit " + p.name
            : {
                root: "Orang pertama",
                spouse: "Tambah pasangan",
                child: "Tambah anak",
                parent: "Tambah orang tua",
              }[c.rel];
        $("fName").value = p.name || "";
        $("fG").value = p.g || c.g || "L";
        $("fBorn").value = p.born || "";
        $("fDied").value = p.died || "";
        $("fNote").value = p.note || "";
        $("btnDel").style.display = c.mode === "edit" ? "" : "none";
        $("dlg").showModal();
        $("fName").focus();
      }
      $("btnCancel").onclick = () => $("dlg").close();
      $("form").addEventListener("submit", () => {
        const data = {
          name: $("fName").value.trim(),
          g: $("fG").value,
          born: $("fBorn").value.trim(),
          died: $("fDied").value.trim(),
          note: $("fNote").value.trim(),
        };
        if (!data.name) return;
        if (ctx.mode === "edit") {
          Object.assign(P(ctx.id), data);
          save();
          render();
          return;
        }
        const n = {
          id: uid(),
          order: db.seq++,
          father: null,
          mother: null,
          spouses: [],
          ...data,
        };
        const ref = P(ctx.ref);
        if (ctx.rel === "spouse") {
          n.spouses.push({ id: ref.id, status: "married" });
          ref.spouses.push({ id: n.id, status: "married" });
        }
        if (ctx.rel === "child") {
          const partner = ctx.partner ? P(ctx.partner) : null;
          const dad = ref.g === "L" ? ref : partner;
          const mom = ref.g === "P" ? ref : partner;
          n.father = dad ? dad.id : null;
          n.mother = mom ? mom.id : null;
        }
        if (ctx.rel === "parent") {
          const otherId = ref.father === undefined ? null : null; // placeholder, replaced below
          if (n.g === "L") ref.father = n.id;
          else ref.mother = n.id;
          const other = P(n.g === "L" ? ref.mother : ref.father);
          if (other && !other.spouses.some((s) => s.id === n.id)) {
            n.spouses.push({ id: other.id, status: "married" });
            other.spouses.push({ id: n.id, status: "married" });
          }
        }
        db.people[n.id] = n;
        if (ctx.rel === "root") db.pivot = n.id;
        save();
        render();
      });
      $("btnDel").onclick = () => {
        const p = P(ctx.id);
        if (
          !confirm(
            "Hapus " + p.name + "? Hubungan ke keluarganya ikut terputus.",
          )
        )
          return;
        Object.values(db.people).forEach((o) => {
          ["father", "mother"].forEach((k) => {
            if (o[k] === p.id) o[k] = null;
          });
          if (Array.isArray(o.spouses))
            o.spouses = o.spouses.filter((s) => s.id !== p.id);
        });
        delete db.people[p.id];
        if (db.pivot === p.id)
          db.pivot =
            p.father && P(p.father)
              ? p.father
              : p.mother && P(p.mother)
                ? p.mother
                : Object.keys(db.people)[0] || null;
        save();
        $("dlg").close();
        render();
      };

      // ---------- Lompat, ekspor, impor ----------
      $("pick").onchange = (e) => {
        if (e.target.value) go(e.target.value);
      };
      $("btnExport").onclick = () => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(
          new Blob([JSON.stringify(db, null, 2)], { type: "application/json" }),
        );
        a.download =
          "silsilah-" + new Date().toISOString().slice(0, 10) + ".json";
        a.click();
      };
      $("btnImport").onclick = () => $("file").click();
      $("file").onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const d = JSON.parse(r.result);
            if (!d.people) throw 0;
            if (confirm("Ganti semua data sekarang dengan isi file ini?")) {
              db = d;
              normalize();
              save();
              render();
            }
          } catch (x) {
            alert("File tidak valid.");
          }
        };
        r.readAsText(f);
        e.target.value = "";
      };
      render();
    </script>
  </body>
</html>
