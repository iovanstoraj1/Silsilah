<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Silsilah Keluarga (Admin)</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <header>
      <h1>Silsilah Keluarga · Admin</h1>
      <select id="pick" aria-label="Lompat ke orang"></select>
      <button id="btnExport">Ekspor</button>
      <button id="btnImport">Impor</button>
      <input type="file" id="file" accept=".json" hidden />
    </header>
    <nav id="crumbs" aria-label="Jalur keturunan"></nav>
    <div id="banner" hidden></div>
    <main id="main"></main>

    <dialog id="dlg">
      <form id="form" method="dialog">
        <h2 id="dTitle"></h2>
        <label for="fName">Nama</label><input id="fName" required />
        <div class="two">
          <div>
            <label for="fG">Jenis kelamin</label>
            <select id="fG">
              <option value="L">Laki-laki</option>
              <option value="P">Perempuan</option>
            </select>
          </div>
          <div>
            <label for="fBorn">Lahir (tahun)</label>
            <input id="fBorn" placeholder="1950" />
          </div>
        </div>
        <label for="fDied">Wafat (tahun, kosongkan bila masih hidup)</label>
        <input id="fDied" />
        <label for="fNote">Catatan</label>
        <textarea id="fNote" rows="2"></textarea>
        <div id="pbox">
          <div class="two">
            <div>
              <label for="fFa">Ayah</label>
              <select id="fFa"></select>
            </div>
            <div>
              <label for="fMo">Ibu</label>
              <select id="fMo"></select>
            </div>
          </div>
          <label for="fAdopt">Status sebagai anak</label>
          <select id="fAdopt">
            <option value="">Anak kandung</option>
            <option value="1">Anak angkat</option>
          </select>
        </div>
        <div class="foot">
          <button type="button" id="btnDel" class="danger">Hapus</button>
          <button type="button" id="btnCancel">Batal</button>
          <button class="primary">Simpan</button>
        </div>
      </form>
    </dialog>

    <script src="scripts/core.js"></script>
    <script src="scripts/editor.js"></script>
  </body>
</html>
